<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つくったもの一覧｜pikaring</title>
<meta name="description" content="pikaring がつくった、ブラウザだけで動く道具とゲームの一覧。インストールも登録も要らず、開けばすぐに使えます。">
<meta name="theme-color" content="#2f5d3a">

<!-- 一覧は サイトの 入口（https://pikaring.github.io/）に 移しました。
     GitHub Pages は 301 を 返せないので、canonical と meta refresh で 引きわたします。 -->
<link rel="canonical" href="https://pikaring.github.io/">
<meta http-equiv="refresh" content="0; url=https://pikaring.github.io/">
<meta name="robots" content="noindex, follow">

<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/site.css">
<style>
  .moved { max-width: 32rem; margin: 18vh auto 0; padding: 0 1.25rem; text-align: center; }
  .moved img { width: 72px; height: 72px; border-radius: 18px; }
  .moved h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; }
  .moved p { margin: 0 0 1.25rem; }
  .moved a.go { display: inline-block; padding: .6rem 1.4rem; border-radius: 999px;
                background: #2f5d3a; color: #fff; text-decoration: none; font-weight: 700; }
</style>
<script>location.replace('https://pikaring.github.io/');</script>
</head>
<body>
<div class="moved">
  <img src="assets/icon.png" alt="">
  <h1>引っこしました</h1>
  <p>「つくったもの一覧」は <b>pikaring.github.io</b> の入口に移りました。<br>
     自動で移ります。移らないときは下のボタンからどうぞ。</p>
  <p><a class="go" href="https://pikaring.github.io/">一覧を見る</a></p>
</div>
</body>
</html>
